const SHEET_NAME = "Presensi";

function doPost(e){
  try{

    }

    const waktuServer = new Date(); // server time

    if(rows.length>0) sh.getRange(sh.getLastRow()+1,1,rows.length, rows[0].length).setValues(rows);
    
    return ContentService.createTextOutput(JSON.stringify({ok:true, saved: rows.length})).setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({ok:false, error: err.message})).setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(){
